# main에 올라오면 Firebase Hosting(goem-82232.web.app)으로 자동 배포
# 필요: 저장소 Secrets에 FIREBASE_SERVICE_ACCOUNT (Firebase 서비스 계정 비공개 키 JSON)
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: goem-82232
